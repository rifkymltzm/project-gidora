  /api/v1/checkout/preview/:
    get:
      operationId: checkout_preview
      description: |-
        Return a checkout summary based on the authenticated user's active cart.

        The response contains:
        - Cart items and current product variant information.
        - Available stock for each item.
        - Active shipping methods.
        - The selected shipping method, when provided.
        - Subtotal, discount, shipping amount, tax, and grand total.

        Use `shipping_method_id` to calculate the total with a specific shipping method. If it is omitted, `shipping_amount` is `0` and no shipping method is selected.

        This endpoint is read-only. It does not create an order, convert the cart, or reserve inventory.
      summary: Preview Checkout
      parameters:
      - in: query
        name: shipping_method_id
        schema:
          type: integer
        description: ID of an active shipping method to include in the checkout calculation.
      tags:
      - Checkout
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutSummary'
          description: Checkout summary successfully retrieved.
        '400':
          description: Checkout preview cannot be generated. Possible reasons include
            missing or empty active cart, inactive product variant, missing inventory,
            insufficient stock, invalid shipping method ID, or inactive shipping method.
        '401':
          description: Authentication required.
  /api/v1/orders/:
    get:
      operationId: orders_list
      description: |-
        Return all orders belonging to the authenticated customer.

        Orders are returned from newest to oldest.
      summary: List My Orders
      tags:
      - Orders
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderList'
          description: Orders successfully retrieved.
        '401':
          description: Authentication required.
    post:
      operationId: orders_create
      description: |-
        Create a new order from the authenticated user's active cart.

        Shipping address must be provided using exactly one of these sources:
        - `shipping_address_id`: use an existing address belonging to the authenticated user.
        - `shipping_address`: provide a new address for this order without saving it to the account.

        The selected shipping method must be active. The address is copied into the order as an address snapshot.

        The order is created with `PENDING` status. Inventory is reserved for the order and the active cart is converted to `CONVERTED` status as part of the same transaction.

        If order creation or inventory reservation fails, the transaction is rolled back.
      summary: Create Order
      tags:
      - Orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrderCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrderCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: Order successfully created.
        '400':
          description: Invalid request or order cannot be created. Possible reasons
            include missing or conflicting shipping address sources, invalid shipping
            method, empty or missing active cart, inactive product variant, or insufficient
            inventory.
        '401':
          description: Authentication required.
  /api/v1/orders/{order_number}/:
    get:
      operationId: orders_retrieve
      description: |-
        Return detailed information about a specific order belonging to the authenticated customer.

        An order can only be retrieved by its owner.
      summary: Get My Order Detail
      parameters:
      - in: path
        name: order_number
        schema:
          type: string
        description: Unique GIDORA order number.
        required: true
      tags:
      - Orders
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: Order detail successfully retrieved.
        '401':
          description: Authentication required.
        '404':
          description: Order not found or the order does not belong to the authenticated
            customer.
  /api/v1/orders/{order_number}/cancel/:
    post:
      operationId: orders_cancel
      description: |-
        Cancel a pending order belonging to the authenticated customer.

        Only orders with `PENDING` status can be cancelled. Active inventory reservations are released automatically.

        An order that already has a payment created cannot be cancelled directly through this endpoint.
      summary: Cancel My Order
      parameters:
      - in: path
        name: order_number
        schema:
          type: string
        description: Unique GIDORA order number.
        required: true
      tags:
      - Orders
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: Order successfully cancelled.
        '400':
          description: Order cannot be cancelled because it is not in `PENDING` status
            or a payment has already been created.
        '401':
          description: Authentication required.
        '404':
          description: Order not found or the order does not belong to the authenticated
            customer.
  /api/v1/payments/:
    post:
      operationId: payments_create
      description: |2

        Create a payment for the authenticated user's pending order.

        The request only contains the order number and selected payment method.
        The backend is responsible for translating the selected payment method
        into the appropriate Midtrans Core API charge payload.

        \### Supported payment methods

        \| Payment method | Midtrans method | Payment data returned |
        \|---|---|---|
        \| \`BCA_VA\` | Bank Transfer | \`bank\`, \`va_number\`, \`expires_at\` |
        \| \`BNI_VA\` | Bank Transfer | \`bank\`, \`va_number\`, \`expires_at\` |
        \| \`BRI_VA\` | Bank Transfer | \`bank\`, \`va_number\`, \`expires_at\` |
        \| \`PERMATA_VA\` | Bank Transfer | \`bank\`, \`va_number\`, \`expires_at\` |
        \| \`CIMB_VA\` | Bank Transfer | \`bank\`, \`va_number\`, \`expires_at\` |
        \| \`MANDIRI\` | E-Channel | \`bill_key\`, \`biller_code\`, \`expires_at\` |
        \| \`GOPAY\` | GoPay | \`payment_url\`, \`expires_at\` |
        \| \`SHOPEEPAY\` | ShopeePay | \`payment_url\`, \`expires_at\` |
        \| \`QRIS\` | QRIS | \`qr_string\` and/or \`payment_url\`, \`expires_at\` |

        The frontend should inspect the returned payment fields based on the
        selected \`payment_method\`.

        For example:

        \- VA methods use \`va_number\`.
        \- \`MANDIRI\` uses \`bill_key\` and \`biller_code\`.
        \- \`GOPAY\` and \`SHOPEEPAY\` may use \`payment_url\`.
        \- \`QRIS\` may use \`qr_string\` and/or \`payment_url\`.

        The payment is created in \`PENDING\` status. The actual payment status
        is updated through the Midtrans notification webhook or through the
        payment status sync endpoint.

        This endpoint does not accept payment-specific fields such as
        \`va_number\`, \`bill_key\`, \`qr_string\`, or \`payment_url\`. Those values are
        generated by Midtrans and returned in the response.
      summary: Create Payment
      tags:
      - Payments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCreate'
            examples:
              BCAVirtualAccountRequest:
                value:
                  order_number: GDR-20260930-0001
                  payment_method: BCA_VA
                summary: BCA Virtual Account Request
              MandiriRequest:
                value:
                  order_number: GDR-20260930-0002
                  payment_method: MANDIRI
                summary: Mandiri Request
              QRISRequest:
                value:
                  order_number: GDR-20260930-0003
                  payment_method: QRIS
                summary: QRIS Request
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PaymentCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaymentCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
              examples:
                BCAVirtualAccount:
                  value:
                    id: 1
                    order_number: GDR-20260930-0001
                    provider: MIDTRANS
                    payment_method: BCA_VA
                    status: PENDING
                    transaction_id: midtrans-transaction-001
                    amount: '515000.00'
                    currency: IDR
                    bank: bca
                    va_number: '1234567890'
                    bill_key: null
                    biller_code: null
                    qr_string: null
                    payment_url: null
                    paid_at: null
                    expires_at: '2026-10-01T15:30:00+07:00'
                    created_at: '2026-10-01T14:30:00+07:00'
                  summary: BCA Virtual Account
                MandiriBillPayment:
                  value:
                    id: 2
                    order_number: GDR-20260930-0002
                    provider: MIDTRANS
                    payment_method: MANDIRI
                    status: PENDING
                    transaction_id: midtrans-transaction-002
                    amount: '750000.00'
                    currency: IDR
                    bank: null
                    va_number: null
                    bill_key: '123456789012'
                    biller_code: '70012'
                    qr_string: null
                    payment_url: null
                    paid_at: null
                    expires_at: '2026-10-01T15:30:00+07:00'
                    created_at: '2026-10-01T14:30:00+07:00'
                  summary: Mandiri Bill Payment
                QRIS:
                  value:
                    id: 3
                    order_number: GDR-20260930-0003
                    provider: MIDTRANS
                    payment_method: QRIS
                    status: PENDING
                    transaction_id: midtrans-transaction-003
                    amount: '250000.00'
                    currency: IDR
                    bank: null
                    va_number: null
                    bill_key: null
                    biller_code: null
                    qr_string: 000201010212...
                    payment_url: https://app.midtrans.com/snap/vtweb/...
                    paid_at: null
                    expires_at: '2026-10-01T15:30:00+07:00'
                    created_at: '2026-10-01T14:30:00+07:00'
          description: Payment successfully created.
        '400':
          description: Invalid payment request or order state.
        '401':
          description: Authentication credentials were not provided.
        '404':
          description: Order not found for the authenticated user.
        '502':
          description: Midtrans API error.
  /api/v1/payments/notification/:
    post:
      operationId: payments_midtrans_notification
      description: |2

        Receive payment status notifications from Midtrans.

        This endpoint is called by Midtrans and does not use JWT authentication.

        The request signature is verified using the Midtrans signature formula:

        \`SHA512(order_id + status_code + gross_amount + ServerKey)\`

        The notification is processed idempotently. Terminal payment states
        are not applied repeatedly.

        Successful settlement/capture changes the payment to \`PAID\`, confirms
        the order, confirms the inventory reservation, and creates the shipment.

        Failed, denied, cancelled, or expired payments release the inventory
        reservation and may cancel the order when the order is still pending.
      summary: Receive Midtrans Notification
      tags:
      - Payments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MidtransNotification'
            examples:
              SettlementNotification:
                value:
                  order_id: GDR-20260930-0001
                  transaction_id: midtrans-transaction-001
                  transaction_status: settlement
                  status_code: '200'
                  status_message: Success, transaction is found
                  gross_amount: '515000.00'
                  currency: IDR
                  payment_type: bank_transfer
                  fraud_status: accept
                  signature_key: generated-by-midtrans
                  bank: bca
                  va_numbers:
                  - bank: bca
                    va_number: '1234567890'
                summary: Settlement Notification
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MidtransNotification'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MidtransNotification'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                Success:
                  value:
                    status: OK
          description: Notification successfully processed.
        '400':
          description: Invalid notification payload.
        '403':
          description: Invalid Midtrans signature.
        '404':
          description: Payment or order was not found.
  /api/v1/payments/orders/{order_number}/sync/:
    post:
      operationId: payments_status_sync
      description: |2

        Synchronize the payment status of an order with Midtrans.

        This endpoint is a fallback reconciliation mechanism when a Midtrans
        notification has not been received yet. It does not replace the
        Midtrans notification webhook.

        Only the authenticated owner of the order can perform this operation.
      summary: Sync Payment Status
      parameters:
      - in: path
        name: order_number
        schema:
          type: string
        description: GIDORA order number.
        required: true
        examples:
          OrderNumber:
            value: GDR-20260930-0001
            summary: Order Number
      tags:
      - Payments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
              examples:
                PaymentStatus:
                  value:
                    id: 1
                    order_number: GDR-20260930-0001
                    provider: MIDTRANS
                    payment_method: BCA_VA
                    status: PAID
                    transaction_id: midtrans-transaction-001
                    amount: '515000.00'
                    currency: IDR
                    bank: bca
                    va_number: '1234567890'
                    bill_key: null
                    biller_code: null
                    qr_string: null
                    payment_url: null
                    paid_at: '2026-10-01T14:45:00+07:00'
                    expires_at: '2026-10-01T15:30:00+07:00'
                    created_at: '2026-10-01T14:30:00+07:00'
                  summary: Payment Status
          description: Payment status successfully synchronized.
        '400':
          description: Payment status cannot be synchronized.
        '401':
          description: Authentication credentials were not provided.
        '404':
          description: Order or payment not found.
        '502':
          description: Midtrans API error.
  /api/v1/shipping/methods/:
    get:
      operationId: shipping_methods_list
      description: |2

        Retrieve all active shipping methods available to customers.

        This endpoint is used during checkout so the customer can select
        a shipping method before creating an order.

        Each shipping method contains:

        - `id` — shipping method identifier used when creating an order.
        - `code` — unique shipping method code.
        - `courier` — courier name.
        - `service` — courier service.
        - `price` — static shipping price in IDR.

        Only shipping methods with `is_active=true` are returned.

        For the current MVP, shipping prices are static and are not calculated
        dynamically based on destination, weight, or courier API.
      summary: List Shipping Methods
      tags:
      - Shipping
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShippingMethod'
              examples:
                ShippingMethods:
                  value:
                  - - id: 1
                      code: JNE_REG
                      courier: JNE
                      service: REG
                      price: '15000'
                    - id: 2
                      code: JNE_YES
                      courier: JNE
                      service: 'YES'
                      price: '25000'
                  summary: Shipping Methods
          description: List of active shipping methods.
        '401':
          description: Authentication credentials were not provided.
  /api/v1/shipping/{order_number}/:
    get:
      operationId: shipment_retrieve
      description: |2

        Retrieve shipment information for a specific order.

        Customers can only access the shipment belonging to their own order.

        ### Shipment lifecycle

        - `PENDING` — shipment has been created and is waiting for fulfillment.
        - `PROCESSING` — staff is currently processing the order.
        - `SHIPPED` — shipment has been handed to the courier and tracking
          information is available.
        - `DELIVERED` — shipment has been delivered to the customer.
        - `CANCELLED` — shipment was cancelled before being shipped.

        A shipment is normally created automatically when payment succeeds,
        the order becomes `CONFIRMED`, and the fulfillment flow begins.

        The response also includes `order_status`, which represents the overall
        order status separately from the shipment status.
      summary: Get Shipment
      parameters:
      - in: path
        name: order_number
        schema:
          type: string
        description: GIDORA order number.
        required: true
        examples:
          OrderNumber:
            value: GDR-20260929-0008
            summary: Order Number
      tags:
      - Shipping
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shipment'
              examples:
                Shipment:
                  value:
                    id: 1
                    order_number: GDR-20260929-0008
                    order_status: SHIPPED
                    status: SHIPPED
                    courier: JNE
                    service: REG
                    tracking_number: JNE123456789
                    shipped_at: '2026-10-01T10:00:00+07:00'
                    delivered_at: null
                    created_at: '2026-09-30T14:00:00+07:00'
                    updated_at: '2026-10-01T10:00:00+07:00'
                    items:
                    - id: 1
                      product_name_snapshot: Test Shirt
                      sku_snapshot: GDR-SH-001-BLK-M
                      quantity: 2
          description: Shipment information for the specified order.
        '401':
          description: Authentication credentials were not provided.
        '404':
          description: Shipment was not found, or the order does not belong to the
            authenticated customer.
