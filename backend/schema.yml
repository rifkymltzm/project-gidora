      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Activation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Activation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Activation'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activation'
          description: ''
  /api/v1/auth/users/me/:
    patch:
      operationId: v1_auth_users_me_partial_update
      tags:
      - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUser'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    put:
      operationId: v1_auth_users_me_update
      tags:
      - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/User'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/User'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    get:
      operationId: v1_auth_users_me_retrieve
      tags:
      - Accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    delete:
      operationId: v1_auth_users_me_destroy
      tags:
      - Accounts
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/users/resend_activation/:
    post:
      operationId: v1_auth_users_resend_activation_create
      tags:
      - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendEmailReset'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SendEmailReset'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SendEmailReset'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendEmailReset'
          description: ''
  /api/v1/auth/users/reset_password/:
    post:
      operationId: v1_auth_users_reset_password_create
      tags:
      - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendEmailReset'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SendEmailReset'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SendEmailReset'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendEmailReset'
          description: ''
  /api/v1/auth/users/reset_password_confirm/:
    post:
      operationId: v1_auth_users_reset_password_confirm_create
      tags:
      - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetConfirm'
          description: ''
  /api/v1/auth/users/reset_email/:
    post:
      operationId: v1_auth_users_reset_email_create
      tags:
      - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendEmailReset'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SendEmailReset'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SendEmailReset'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendEmailReset'
          description: ''
  /api/v1/auth/users/reset_email_confirm/:
    post:
      operationId: v1_auth_users_reset_email_confirm_create
      tags:
      - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsernameResetConfirm'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UsernameResetConfirm'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UsernameResetConfirm'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsernameResetConfirm'
          description: ''
  /api/v1/auth/users/set_password/:
    post:
      operationId: v1_auth_users_set_password_create
      tags:
      - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SetPassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SetPassword'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetPassword'
          description: ''
  /api/v1/auth/users/set_email/:
    post:
      operationId: v1_auth_users_set_email_create
      tags:
      - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetUsername'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SetUsername'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SetUsername'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetUsername'
          description: ''
  /api/v1/auth/users/{id}/:
    patch:
      operationId: v1_auth_users_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUser'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    put:
      operationId: v1_auth_users_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/User'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/User'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    get:
      operationId: v1_auth_users_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - Accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    delete:
      operationId: v1_auth_users_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - Accounts
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/jwt/create/:
    post:
      operationId: v1_auth_jwt_create_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/v1/auth/jwt/refresh/:
    post:
      operationId: v1_auth_jwt_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/jwt/verify/:
    post:
      operationId: v1_auth_jwt_verify_create
      description: |-
        Takes a token and indicates if it is valid.  This view provides no
        information about a token's fitness for a particular use.
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenVerify'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenVerify'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenVerify'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenVerify'
          description: ''
  /api/v1/accounts/addresses/:
    get:
      operationId: v1_accounts_addresses_list
      description: |-
        Mengambil seluruh alamat milik user yang sedang login.

        Endpoint ini hanya mengembalikan alamat milik user tersebut. Alamat milik user lain tidak dapat diakses.
      summary: List my addresses
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - User Addresses
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAddressList'
          description: Daftar alamat milik user.
        '401':
          description: Authentication diperlukan.
    post:
      operationId: v1_accounts_addresses_create
      description: |-
        Membuat alamat baru untuk user yang sedang login.

        Field `user` tidak perlu dikirim karena user diambil secara otomatis dari JWT authentication.
      summary: Create address
      tags:
      - User Addresses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Address'
            examples:
              CreateAddress:
                value:
                  label: Home
                  recipient_name: GIDORA Customer
                  phone_number: 081234567890
                  address_line: Jl. Contoh No. 123
                  sub_district: Kebayoran Baru
                  district: Jakarta Selatan
                  city: Jakarta Selatan
                  province: DKI Jakarta
                  postal_code: '12190'
                  country: Indonesia
                summary: Create address
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Address'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Address'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: Alamat berhasil dibuat.
        '400':
          description: Data alamat tidak valid.
        '401':
          description: Authentication diperlukan.
  /api/v1/accounts/addresses/{id}/:
    patch:
      operationId: v1_accounts_addresses_partial_update
      description: Mengubah sebagian field dari alamat milik user yang sedang login.
      summary: Partially update my address
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this address.
        required: true
      tags:
      - User Addresses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAddress'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAddress'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAddress'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: Alamat berhasil diperbarui.
        '400':
          description: Data alamat tidak valid.
        '401':
          description: Authentication diperlukan.
        '404':
          description: Alamat tidak ditemukan.
    put:
      operationId: v1_accounts_addresses_update
      description: |-
        Mengganti seluruh data alamat milik user yang sedang login.

        Gunakan `PATCH` jika hanya ingin mengubah sebagian field.
      summary: Replace my address
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this address.
        required: true
      tags:
      - User Addresses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Address'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Address'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Address'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: Alamat berhasil diperbarui.
        '400':
          description: Data alamat tidak valid.
        '401':
          description: Authentication diperlukan.
        '404':
          description: Alamat tidak ditemukan.
    get:
      operationId: v1_accounts_addresses_retrieve
      description: |-
        Mengambil detail satu alamat milik user yang sedang login.

        Jika address ID bukan milik user tersebut, API akan mengembalikan 404.
      summary: Get my address
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this address.
        required: true
      tags:
      - User Addresses
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: Detail alamat.
        '401':
          description: Authentication diperlukan.
        '404':
          description: Alamat tidak ditemukan.
    delete:
      operationId: v1_accounts_addresses_destroy
      description: |-
        Menghapus alamat milik user yang sedang login.

        Pastikan alamat tersebut tidak sedang digunakan oleh proses checkout yang aktif.
      summary: Delete my address
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this address.
        required: true
      tags:
      - User Addresses
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Alamat berhasil dihapus.
        '401':
          description: Authentication diperlukan.
        '404':
          description: Alamat tidak ditemukan.
  /api/v1/catalog/products/:
    get:
      operationId: v1_catalog_products_list
      description: |-
        Returns active products for the storefront. Products can be filtered by category, gender, size type, badge, color, and size. Results can also be searched and sorted by name, date, or minimum active variant price.

        Each active product variant also includes `available`, which represents the quantity currently available for purchase (`stock_on_hand - reserved`). If no inventory record exists for a variant, `available` is returned as `0`.
      summary: List products
      parameters:
      - in: query
        name: badge
        schema:
          type: string
        description: Filter products by badge. Badge values are managed as product
          data.
      - in: query
        name: category
        schema:
          type: string
        description: Filter products by category code. Use a category code returned
          by `GET /api/v1/catalog/categories/`.
      - in: query
        name: color
        schema:
          type: string
        description: Filter products by color code. Use a color code returned by `GET
          /api/v1/catalog/colors/`.
      - in: query
        name: gender
        schema:
          type: string
          enum:
          - men
          - unisex
          - women
        description: Filter products by gender.
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -created_at
          - -name
          - -price
          - -updated_at
          - created_at
          - name
          - price
          - updated_at
        description: Sort products by name, creation date, update date, or minimum
          active variant price. Prefix the field with `-` for descending order.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Search by product name, product code, description, material,
          category name, or color name.
      - in: query
        name: size
        schema:
          type: string
        description: Filter products by size name. Available sizes can be retrieved
          from `GET /api/v1/catalog/sizes/`.
      - in: query
        name: size_type
        schema:
          type: string
          enum:
          - APPAREL
          - FOOTWEAR
          - ONE_SIZE
        description: Filter products by size type.
      tags:
      - Catalog
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductList'
          description: List of active products.
  /api/v1/catalog/products/{id}/:
    get:
      operationId: v1_catalog_products_retrieve
      description: |-
        Returns one active product including its category, size type, active colors, active variants, and product images.

        Each active product variant includes `available`, representing the quantity currently available for purchase. If no inventory record exists, `available` is returned as `0`.
      summary: Retrieve product detail
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this product.
        required: true
      tags:
      - Catalog
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: Product detail.
        '404':
          description: Product not found or inactive.
  /api/v1/catalog/categories/:
    get:
      operationId: v1_catalog_categories_list
      description: Returns all active product categories available for the storefront.
        Use a category code returned by this endpoint when filtering products by category.
      summary: List active categories
      parameters:
      - in: query
        name: code
        schema:
          type: string
        description: Filter by category code. Use a category code returned by `GET
          /api/v1/catalog/categories/`.
      - in: query
        name: default_size_type
        schema:
          type: integer
        description: Filter by default SizeType primary key.
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -code
          - -name
          - code
          - name
        description: Sort by category name or code. Prefix the field with `-` for
          descending order.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Search by category name or category code.
      tags:
      - Catalog
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCategoryList'
          description: List of active categories.
  /api/v1/catalog/categories/{id}/:
    get:
      operationId: v1_catalog_categories_retrieve
      description: Returns one active category by ID, including its default size type.
      summary: Retrieve category
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this category.
        required: true
      tags:
      - Catalog
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: Category detail.
        '404':
          description: Category not found or inactive.
  /api/v1/catalog/size-types/:
    get:
      operationId: v1_catalog_size_types_list
      description: Returns all active size types available for the storefront. Use
