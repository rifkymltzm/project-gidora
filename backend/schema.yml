  /api/v1/admin/shipping/{order_number}/processing/:
    post:
      operationId: admin_shipment_processing
      description: |2

        Start fulfillment processing for an order's shipment.

        This endpoint is restricted to staff/admin users.

        ### Requirements

        - Shipment must currently have status `PENDING`.
        - No request body is required.

        ### Result

        - Shipment status → `PROCESSING`
        - Order status → `PROCESSING`

        This endpoint only changes the fulfillment state. It does not modify
        payment data or inventory quantities.
      summary: Start Shipment Processing
      parameters:
      - in: path
        name: order_number
        schema:
          type: string
        description: GIDORA order number.
        required: true
        examples:
          OrderNumber:
            value: GDR-20260929-0008
            summary: Order Number
      tags:
      - Admin Shipping
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shipment'
          description: Shipment successfully moved to PROCESSING.
        '400':
          description: Shipment cannot be processed because its current status is
            not PENDING.
        '401':
          description: Authentication credentials were not provided.
        '403':
          description: Authenticated user is not a staff/admin user.
        '404':
          description: Shipment for the specified order was not found.
  /api/v1/admin/shipping/{order_number}/ship/:
    post:
      operationId: admin_shipment_ship
      description: |2

        Mark a shipment as shipped.

        This endpoint is restricted to staff/admin users.

        ### Requirements

        - Shipment must currently have status `PROCESSING`.
        - `tracking_number` is required.
        - No courier or service is accepted in the request body.

        Courier and service are taken from the shipping snapshot stored on
        the Order and copied to the Shipment when the shipment is marked as
        shipped.

        ### Result

        - Shipment status → `SHIPPED`
        - Order status → `SHIPPED`
        - `shipped_at` is automatically set.
        - Courier and service are copied from the order shipping snapshot.
      summary: Ship Order
      parameters:
      - in: path
        name: order_number
        schema:
          type: string
        description: GIDORA order number.
        required: true
        examples:
          OrderNumber:
            value: GDR-20260929-0008
            summary: Order Number
      tags:
      - Admin Shipping
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShipmentShip'
            examples:
              ShipOrderRequest:
                value:
                  tracking_number: JNE123456789
                summary: Ship Order Request
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ShipmentShip'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ShipmentShip'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shipment'
              examples:
                ShippedShipment:
                  value:
                    id: 1
                    order_number: GDR-20260929-0008
                    order_status: SHIPPED
                    status: SHIPPED
                    courier: JNE
                    service: REG
                    tracking_number: JNE123456789
                    shipped_at: '2026-10-01T10:00:00+07:00'
                    delivered_at: null
                    created_at: '2026-09-30T14:00:00+07:00'
                    updated_at: '2026-10-01T10:00:00+07:00'
                    items:
                    - id: 1
                      product_name_snapshot: Test Shirt
                      sku_snapshot: GDR-SH-001-BLK-M
                      quantity: 2
                  summary: Shipped Shipment
          description: Shipment successfully marked as SHIPPED.
        '400':
          description: Invalid tracking number or shipment is not currently in PROCESSING
            status.
        '401':
          description: Authentication credentials were not provided.
        '403':
          description: Authenticated user is not a staff/admin user.
        '404':
          description: Shipment for the specified order was not found.
  /api/v1/admin/shipping/{order_number}/deliver/:
    post:
      operationId: admin_shipment_deliver
      description: |2

        Mark a shipped shipment as delivered.

        This endpoint is restricted to staff/admin users.

        ### Requirements

        - Shipment must currently have status `SHIPPED`.
        - No request body is required.

        ### Result

        - Shipment status → `DELIVERED`
        - Order status → `DELIVERED`
        - `delivered_at` is automatically set.
      summary: Mark Shipment as Delivered
      parameters:
      - in: path
        name: order_number
        schema:
          type: string
        description: GIDORA order number.
        required: true
        examples:
          OrderNumber:
            value: GDR-20260929-0008
            summary: Order Number
      tags:
      - Admin Shipping
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shipment'
          description: Shipment successfully marked as DELIVERED.
        '400':
          description: Shipment cannot be delivered because its current status is
            not SHIPPED.
        '401':
          description: Authentication credentials were not provided.
        '403':
          description: Authenticated user is not a staff/admin user.
        '404':
          description: Shipment for the specified order was not found.
  /api/v1/admin/shipping/{order_number}/cancel/:
    post:
      operationId: admin_shipment_cancel
      description: |2

        Cancel a shipment before it has been shipped.

        This endpoint is restricted to staff/admin users.

        ### Requirements

        The shipment must currently be:

        - `PENDING`, or
        - `PROCESSING`

        A shipment that is already `SHIPPED` or `DELIVERED` cannot be cancelled
        through this endpoint.

        ### Result

        - Shipment status → `CANCELLED`

        This operation only changes the Shipment status.

        It does **not** automatically change the related Order status to
        `CANCELLED`.
      summary: Cancel Shipment
      parameters:
      - in: path
        name: order_number
        schema:
          type: string
        description: GIDORA order number.
        required: true
        examples:
          OrderNumber:
            value: GDR-20260929-0008
            summary: Order Number
      tags:
      - Admin Shipping
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shipment'
          description: Shipment successfully cancelled.
        '400':
          description: Shipment cannot be cancelled because its current status does
            not allow cancellation.
        '401':
          description: Authentication credentials were not provided.
        '403':
          description: Authenticated user is not a staff/admin user.
        '404':
          description: Shipment for the specified order was not found.
