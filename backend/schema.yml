  /api/v1/admin/catalog/products/:
    get:
      operationId: v1_admin_catalog_products_list
      description: |-
        Returns products for catalog management. This endpoint requires an authenticated staff/admin user.

        Results can be filtered by category, gender, size type, and active status, searched by product information, and sorted by name, product code, or timestamps.
      summary: List products
      parameters:
      - in: query
        name: category
        schema:
          type: integer
        description: Filter by category primary key.
      - in: query
        name: category__code
        schema:
          type: string
        description: Filter by category code. Use a category code managed through
          the Admin Catalog category endpoint.
      - in: query
        name: gender
        schema:
          type: string
          enum:
          - men
          - unisex
          - women
        description: Filter by product gender.
      - in: query
        name: is_active
        schema:
          type: boolean
        description: Filter by product active status.
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -created_at
          - -name
          - -product_code
          - -updated_at
          - created_at
          - name
          - product_code
          - updated_at
        description: Sort products by name, product code, creation date, or update
          date. Prefix the field with - for descending order.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: search
        schema:
